---
name: CI
on:
  merge_group:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha_short: ${{ steps.ctx.outputs.sha_short }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: "audit"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: "false"

      - name: Setup mise-en-place
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Save context information
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Build frontend
        run: mise run build:frontend

      - name: Test
        run: |
          mise run lint

          mise run start:server &
          SERVER_PID=$!
          sleep 5
          kill -INT $SERVER_PID

      - if: |
          github.repository_owner == 'jspaste' &&
          github.event_name == 'merge_group' && startsWith(steps.ctx.outputs.branch, 'gh-readonly-queue/dev/')
        name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "build-frontend"
          path: "./dist/frontend/"
          if-no-files-found: "error"
          retention-days: "1"
          compression-level: "0"

  preview:
    if: |
      github.repository_owner == 'jspaste' &&
      github.event_name == 'merge_group' && startsWith(needs.test.outputs.branch, 'gh-readonly-queue/dev/')
    name: Preview
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "build-frontend"
          path: "./dist/frontend/"

      - name: Deploy preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          command: >-
            pages deploy ./dist/frontend
            --project-name=jspaste
            --branch="${{ github.event_name == 'merge_group' && github.event.pull_request.number || 'dev' }}"
            --commit-hash="${{ needs.test.outputs.sha }}"
            --commit-message="${{ needs.test.outputs.sha }}"
