---
name: CI
on:
  merge_group:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha_short: ${{ steps.ctx.outputs.sha_short }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Save context information
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Post-checkout to allow action to load pkg cache
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
          check-latest: true

      - name: Install deps & build "www/"
        run: task install-ci build-www

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: latest

      - name: Test run server
        run: |
          task start-server &
          SERVER_PID=$!
          sleep 10
          kill $SERVER_PID

      - if: |
          github.repository_owner == 'jspaste' &&
          ((github.event_name == 'pull_request' && !startsWith(steps.ctx.outputs.branch, 'renovate/') && !startsWith(steps.ctx.outputs.branch, 'gh-readonly-queue/')) ||
          (github.event_name == 'merge_group' && startsWith(steps.ctx.outputs.branch, 'gh-readonly-queue/dev/')))
        name: Upload "www/" dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-www
          path: ./www/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  preview:
    if: |
      github.repository_owner == 'jspaste' &&
      ((github.event_name == 'pull_request' && !startsWith(needs.test.outputs.branch, 'renovate/') && !startsWith(needs.test.outputs.branch, 'gh-readonly-queue/')) ||
      (github.event_name == 'merge_group' && startsWith(needs.test.outputs.branch, 'gh-readonly-queue/dev/')))
    name: Preview
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Download "www/" dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-www
          path: ./www/dist/

      - name: Deploy preview
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          command: >-
            pages deploy ./www/dist
            --project-name=jspaste
            --branch="${{ github.event_name == 'pull_request' && format('{0}-{1}', needs.test.outputs.branch, github.event.pull_request.number) || 'dev' }}"
            --commit-hash="${{ needs.test.outputs.sha }}"
            --commit-message="${{ needs.test.outputs.sha }}"
