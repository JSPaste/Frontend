name: CI
on:
  merge_group:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - '.*ignore'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - '.*ignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha_short: ${{ steps.ctx.outputs.sha_short }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Post-checkout to allow action to load pkg cache
      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: stable
          check-latest: true

      - name: Install deps & build "www/"
        run: task install-ci build-www

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e56eedd38eecad18e5d837 # v6.5.0
        with:
          version: latest

      - name: Test run server
        run: |
          task start-server &
          SERVER_PID=$!
          sleep 10
          kill $SERVER_PID

      - if: ${{ github.repository_owner == 'jspaste' && github.event_name != 'merge_group' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') }}
        name: Upload "www/" dist
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-www
          path: ./www/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - if: ${{ github.repository_owner == 'jspaste' && github.event_name != 'merge_group' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') }}
        name: Save context information
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

  preview:
    if: ${{ github.repository_owner == 'jspaste' && github.event_name != 'merge_group' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') }}
    name: Preview
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Download "www/" dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist-www
          path: ./www/dist/

      - name: Deploy preview
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          command: pages deploy ./www/dist --project-name=jspaste --branch="${{ needs.test.outputs.branch }}-${{ github.event.pull_request.number }}" --commit-hash="${{ needs.test.outputs.sha_short }}" --commit-message="${{ github.event.head_commit.message }}"
