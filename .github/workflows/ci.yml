---
name: CI
on:
  merge_group:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha_short: ${{ steps.ctx.outputs.sha_short }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: "audit"

      - name: Save context information
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: "3.x"
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: "false"

      # Post-checkout to allow action to load pkg cache
      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "stable"
          check-latest: "true"

      - name: Install deps & build "frontend/"
        run: task install-ci build-frontend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: "latest"

      - name: Test run server
        run: |
          task start-server &
          SERVER_PID=$!
          sleep 10
          kill $SERVER_PID

      - if: |
          github.repository_owner == 'jspaste' &&
          ((github.event_name == 'pull_request' && !startsWith(steps.ctx.outputs.branch, 'renovate/') && !startsWith(steps.ctx.outputs.branch, 'gh-readonly-queue/')) ||
          (github.event_name == 'merge_group' && startsWith(steps.ctx.outputs.branch, 'gh-readonly-queue/dev/')))
        name: Upload "frontend/" dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "dist-frontend"
          path: "./frontend/dist/"
          if-no-files-found: "error"
          retention-days: "1"
          compression-level: "0"

  preview:
    if: |
      github.repository_owner == 'jspaste' &&
      ((github.event_name == 'pull_request' && !startsWith(needs.test.outputs.branch, 'renovate/') && !startsWith(needs.test.outputs.branch, 'gh-readonly-queue/')) ||
      (github.event_name == 'merge_group' && startsWith(needs.test.outputs.branch, 'gh-readonly-queue/dev/')))
    name: Preview
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Download "frontend/" dist
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: "dist-frontend"
          path: "./frontend/dist/"

      - name: Deploy preview
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          command: >-
            pages deploy ./frontend/dist
            --project-name=jspaste
            --branch="${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'dev' }}"
            --commit-hash="${{ needs.test.outputs.sha }}"
            --commit-message="${{ needs.test.outputs.sha }}"
