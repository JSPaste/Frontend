---
name: CD
on:
  workflow_dispatch:
    inputs:
      artifact-action:
        description: Artifact action
        type: choice
        required: true
        default: none
        options:
          - none
          - build
          - build-release

      image-action:
        description: Container image action
        type: choice
        required: true
        default: none
        options:
          - none
          - build
          - build-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifact:
    if: github.repository_owner == 'jspaste' && inputs.artifact-action != 'none'
    name: Release artifact
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: "audit"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: "3.x"
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Save context
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Save tags
        id: tags
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          SHA_SHORT: ${{ steps.ctx.outputs.sha_short }}
        run: |
          TIMESTAMP="$(date +%Y.%m.%d)"

          if [[ "${BRANCH}" == "stable" ]]; then
            TAG="latest"
          else
            TAG="snapshot"
          fi

          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "extended=${TIMESTAMP}-${SHA_SHORT}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      # Post-checkout to allow action to load pkg cache
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "stable"
          check-latest: "true"

      - name: Install deps & build "frontend/"
        run: task install-ci build-frontend

      - name: Build artifact
        run: |
          GOOS=darwin GOARCH=arm64 task build-server
          chmod 755 ./build/bin/server
          tar -c --owner=0 --group=0 --mtime='now' --utc .env.example LICENSE README.md -C ./build/bin/ server | xz -z -6 >./build/bin/frontend_${{ steps.tags.outputs.tag }}_darwin-arm64.tar.xz
          tar -tJf ./build/bin/frontend_${{ steps.tags.outputs.tag }}_darwin-arm64.tar.xz >/dev/null

          GOOS=linux GOARCH=amd64 task build-server
          chmod 755 ./build/bin/server
          tar -c --owner=0 --group=0 --mtime='now' --utc .env.example LICENSE README.md -C ./build/bin/ server | xz -z -6 >./build/bin/frontend_${{ steps.tags.outputs.tag }}_linux-amd64.tar.xz
          tar -tJf ./build/bin/frontend_${{ steps.tags.outputs.tag }}_linux-amd64.tar.xz >/dev/null

          GOOS=linux GOARCH=arm64 task build-server
          chmod 755 ./build/bin/server
          tar -c --owner=0 --group=0 --mtime='now' --utc .env.example LICENSE README.md -C ./build/bin/ server | xz -z -6 >./build/bin/frontend_${{ steps.tags.outputs.tag }}_linux-arm64.tar.xz
          tar -tJf ./build/bin/frontend_${{ steps.tags.outputs.tag }}_linux-arm64.tar.xz >/dev/null

          GOOS=windows GOARCH=amd64 task build-server
          chmod 755 ./build/bin/server.exe
          zip -j -X -9 -l -o ./build/bin/frontend_${{ steps.tags.outputs.tag }}_windows-amd64.zip .env.example LICENSE README.md ./build/bin/server.exe
          zip -T ./build/bin/frontend_${{ steps.tags.outputs.tag }}_windows-amd64.zip

      - if: inputs.artifact-action == 'build-release'
        name: Release artifact
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af # v1.18.0
        with:
          name: "${{ steps.tags.outputs.extended }}"
          tag: "${{ steps.tags.outputs.extended }}"
          artifacts: "build/bin/*.tar.xz,build/bin/*.zip"
          makeLatest: "true"
          prerelease: "${{ steps.ctx.outputs.branch != 'stable' }}"
          generateReleaseNotes: "${{ steps.ctx.outputs.branch == 'stable' }}"

      - if: inputs.artifact-action == 'build-release'
        name: Attest artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            build/bin/*.tar.xz
            build/bin/*.zip

  container-release:
    if: github.repository_owner == 'jspaste' && inputs.image-action != 'none'
    name: Release container image
    runs-on: ubuntu-latest
    outputs:
      tags: "${{ steps.image.outputs.tags }}"
      digest: "${{ steps.release.outputs.digest }}"
      registries: "${{ steps.release.outputs.registries }}"

    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: "audit"

      - name: Save context
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: "ghcr.io"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build container image
        id: image
        env:
          GHA_BRANCH: "${{ steps.ctx.outputs.branch }}"
          GHA_SHA: "${{ steps.ctx.outputs.sha }}"
          GHA_SHA_SHORT: "${{ steps.ctx.outputs.sha_short }}"
          GHA_CONTAINER_ORGANIZATION: "jspaste"
          GHA_CONTAINER_IMAGE: "frontend"
        run: ./.github/scripts/build-container.sh

      - if: inputs.image-action == 'build-release'
        name: Release container image
        id: release
        env:
          GHA_TAG: "${{ steps.image.outputs.tags }}"
          GHA_REGISTRY: "ghcr.io quay.io"
          GHA_CONTAINER_ORGANIZATION: "jspaste"
          GHA_CONTAINER_IMAGE: "frontend"
          GHA_REGISTRY_ACCOUNT_NAME: "${{ github.repository_owner }} ${{ secrets.QUAY_PRODUCTION_CD_USER }}"
          GHA_REGISTRY_ACCOUNT_TOKEN: "${{ secrets.GITHUB_TOKEN }} ${{ secrets.QUAY_PRODUCTION_CD_TOKEN }}"
        run: ./.github/scripts/release-container.sh

  container-attest:
    if: github.repository_owner == 'jspaste' && inputs.image-action == 'build-release'
    name: Attest container image
    runs-on: ubuntu-latest
    needs: container-release
    strategy:
      matrix:
        registry: ${{ fromJson(needs.container-release.outputs.registries) }}

    permissions:
      attestations: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: "audit"

      - name: Attest image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: "${{ matrix.registry }}/jspaste/frontend"
          subject-digest: "${{ needs.container-release.outputs.digest }}"
