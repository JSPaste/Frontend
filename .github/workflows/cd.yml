---
name: CD
on:
  workflow_dispatch:
    inputs:
      artifact-action:
        description: Artifact action
        type: choice
        required: true
        default: none
        options:
          - none
          - build
          - build-release
      image-action:
        description: Container image action
        type: choice
        required: true
        default: none
        options:
          - none
          - build
          - build-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifact:
    if: github.repository_owner == 'jspaste' && inputs.artifact-action != 'none'
    name: Release artifact
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x

      - name: Save context
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Save tags
        id: tags
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          SHA_SHORT: ${{ steps.ctx.outputs.sha_short }}
        run: |
          TIMESTAMP="$(date +%Y.%m.%d)"

          if [[ "${BRANCH}" == "stable" ]]; then
            TAG="latest"
          else
            TAG="snapshot"
          fi

          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "extended=${TIMESTAMP}-${SHA_SHORT}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Post-checkout to allow action to load pkg cache
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
          check-latest: true

      - name: Install deps & build "www/"
        run: task install-ci build-www

      - name: Build artifact
        run: |
          GOOS=darwin GOARCH=arm64 task build-server
          chmod 755 ./dist/server
          tar -c --owner=0 --group=0 --mtime='now' --utc .env.example LICENSE README.md -C ./dist/ server | xz -z -6 >./dist/frontend_${{ steps.tags.outputs.tag }}_darwin-arm64.tar.xz
          tar -tJf ./dist/frontend_${{ steps.tags.outputs.tag }}_darwin-arm64.tar.xz >/dev/null

          GOOS=linux GOARCH=amd64 task build-server
          chmod 755 ./dist/server
          tar -c --owner=0 --group=0 --mtime='now' --utc .env.example LICENSE README.md -C ./dist/ server | xz -z -6 >./dist/frontend_${{ steps.tags.outputs.tag }}_linux-amd64.tar.xz
          tar -tJf ./dist/frontend_${{ steps.tags.outputs.tag }}_linux-amd64.tar.xz >/dev/null

          GOOS=linux GOARCH=arm64 task build-server
          chmod 755 ./dist/server
          tar -c --owner=0 --group=0 --mtime='now' --utc .env.example LICENSE README.md -C ./dist/ server | xz -z -6 >./dist/frontend_${{ steps.tags.outputs.tag }}_linux-arm64.tar.xz
          tar -tJf ./dist/frontend_${{ steps.tags.outputs.tag }}_linux-arm64.tar.xz >/dev/null

          GOOS=windows GOARCH=amd64 task build-server
          chmod 755 ./dist/server.exe
          zip -j -X -9 -l -o ./dist/frontend_${{ steps.tags.outputs.tag }}_windows-amd64.zip .env.example LICENSE README.md ./dist/server.exe
          zip -T ./dist/frontend_${{ steps.tags.outputs.tag }}_windows-amd64.zip

      - if: inputs.artifact-action == 'build-release'
        name: Release artifact
        uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174 # v1.16.0
        with:
          name: ${{ steps.tags.outputs.extended }}
          tag: ${{ steps.tags.outputs.extended }}
          artifacts: dist/*.tar.xz,dist/*.zip
          makeLatest: true
          prerelease: ${{ steps.ctx.outputs.branch != 'stable' }}
          generateReleaseNotes: ${{ steps.ctx.outputs.branch == 'stable' }}

      - if: inputs.artifact-action == 'build-release'
        name: Attest artifact
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip

  container:
    if: github.repository_owner == 'jspaste' && inputs.image-action != 'none'
    name: Release container image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    permissions:
      attestations: write
      id-token: write
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - name: Save context
        id: ctx
        env:
          CTX_BRANCH: ${{ github.head_ref || github.ref_name }}
          CTX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "branch=${CTX_BRANCH}" >>"$GITHUB_OUTPUT"
          echo "sha=${CTX_SHA}" >>"$GITHUB_OUTPUT"
          echo "sha_short=${CTX_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Save tags
        id: tags
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          SHA: ${{ steps.ctx.outputs.sha }}
          SHA_SHORT: ${{ steps.ctx.outputs.sha_short }}
        run: |
          TIMESTAMP="$(date +%Y.%m.%d)"
          TIMESTAMP_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "${BRANCH}" == "stable" ]]; then
            TAGS+=("latest")
          else
            TAGS+=("snapshot")
          fi

          TAGS+=("${SHA}")
          TAGS+=("${TIMESTAMP}-${SHA_SHORT}")

          echo "timestamp=${TIMESTAMP}" >>"$GITHUB_OUTPUT"
          echo "timestamp_iso=${TIMESTAMP_ISO}" >>"$GITHUB_OUTPUT"
          echo "version=${TIMESTAMP}-${SHA_SHORT}" >>"$GITHUB_OUTPUT"
          echo "list=${TAGS[*]}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          containerfiles: Dockerfile
          platforms: linux/amd64,linux/arm64
          image: ${{ github.repository }}
          layers: true
          oci: true
          tags: ${{ steps.tags.outputs.list }}
          extra-args: |
            --squash
            --identity-label=false
            --label=org.opencontainers.image.created=${{ steps.tags.outputs.timestamp_iso }}
            --label=org.opencontainers.image.revision=${{ steps.ctx.outputs.sha }}
            --label=org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      - if: inputs.image-action == 'build-release'
        name: Login to GHCR
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - if: inputs.image-action == 'build-release'
        name: Push to GHCR
        id: push-image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - if: inputs.image-action == 'build-release'
        name: Attest image
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: "${{ env.REGISTRY }}/${{ steps.build-image.outputs.image }}"
          subject-digest: ${{ steps.push-image.outputs.digest }}
          push-to-registry: false
